name: Publish to Thunderstore

# Runs on a pushed v*.*.* tag, or is called by release.yml (a tag pushed with
# the default GITHUB_TOKEN does not trigger other workflows, so release.yml
# calls this one directly).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      ref:
        description: "Tag to publish (vX.Y.Z)"
        required: true
        type: string
    secrets:
      TCLI_AUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, skip publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Extract & Verify Version
        id: version
        env:
          REF: ${{ inputs.ref || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          TOML_VERSION=$(make -s version)
          if [ -n "$REF" ]; then
            TAG_VERSION="${REF#v}"
            if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
              echo "::error::Tag ($TAG_VERSION) does not match TOML ($TOML_VERSION)"
              exit 1
            fi
          fi
          if ! grep -q "^## \[$TOML_VERSION\]" CHANGELOG.md; then
            echo "::error::Version $TOML_VERSION not found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$TOML_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "Processing version: $TOML_VERSION"

      - uses: ./.github/actions/setup-tools
        with:
          tcli: "true"

      - name: Build Package
        run: make build

      - name: Build r2modman Profile (.r2z)
        run: make profile OUT="build/Fimbulwinter-v${{ steps.version.outputs.version }}-profile.r2z"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderstore-package
          path: |
            build/*.zip
            build/*.r2z
          retention-days: 14

      - name: Publish to Thunderstore
        if: steps.version.outputs.tag != '' || inputs.dry_run == 'false'
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          PACKAGE=$(ls build/*.zip | head -1)
          tcli publish --config-path thunderstore.toml --file "$PACKAGE" --token "$TCLI_AUTH_TOKEN"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: needs.build-and-publish.outputs.tag != ''
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-publish.outputs.tag }}
          fetch-depth: 0   # release notes compare against the previous tag

      - uses: ./.github/actions/setup-tools

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: thunderstore-package
          path: dist/

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          python3 scripts/pipeline/release_notes.py github \
            --version "${{ needs.build-and-publish.outputs.version }}" \
            ${prev:+--from "$prev"} --cliff git-cliff --out release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-publish.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.r2z
          body_path: release-notes.md
          name: Fimbulwinter v${{ needs.build-and-publish.outputs.version }}
          generate_release_notes: false
