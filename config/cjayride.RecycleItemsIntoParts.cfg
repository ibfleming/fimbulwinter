## Settings file was created by plugin Recycle Items Into Parts v1.8.10
## Plugin GUID: cjayride.RecycleItemsIntoParts

[General]

## If true, clients must use the server/host recycle settings. If false, each player uses their own config.
# Setting type: Boolean
# Default value: true
ServerEnforced = true

## Keyboard key name (Unity KeyCode). Use Delete, not delete.
# Setting type: String
# Default value: Delete
RecycleHotkey = Delete

## Enable this mod
# Setting type: Boolean
# Default value: true
Enabled = true

## Return resources if recipe is unknown
# Setting type: Boolean
# Default value: true
ReturnUnknownResources = true

## Return resources for Epic Loot enchantments
# Setting type: Boolean
# Default value: true
ReturnEnchantedResources = true

## Fraction of craft materials to return (0.0 - 1.0). 0.40 means 1 wood returns 0, 3 wood returns 1.
# Setting type: Single
# Default value: 0.4
ReturnResources = 0.4

## Fraction of EpicLoot enchant materials to return after the rarity drop (0.0 - 1.0). 5 Magic Dust at 0.40 returns 2.
# Setting type: Single
# Default value: 0.4
ReturnResourcesMagic = 0.4

## Enable/disable coins on recycling items
# Setting type: Boolean
# Default value: false
RecycleCoins = false

## Enable/disable recycling of consumables (like food) (need to disable for cjaycraft ultimate modpack)
# Setting type: Boolean
# Default value: true
RecycleConsumables = true

## Enable/disable recycling of Trophy items (need to disable for cjaycraft ultimate modpack)
# Setting type: Boolean
# Default value: true
RecycleTrophy = true

## Enable/disable recycling of Shards (need to disable for cjaycraft ultimate modpack)
# Setting type: Boolean
# Default value: true
RecycleShards = true

## Return EpicLoot enchant materials one rarity lower (Legendary -> Epic). Rare+ stay one tier down.
# Setting type: Boolean
# Default value: true
DowngradeEnchantRarity = true

## If true, green/Magic items return a little Magic Dust instead of no enchant mats.
# Setting type: Boolean
# Default value: true
MagicDustSoftener = true

## Magic Dust given by the green-item softener (1 or 2).
# Setting type: Int32
# Default value: 1
MagicDustSoftenerAmount = 1

## Show a Yes/No popup with returned parts before recycling.
# Setting type: Boolean
# Default value: true
RequireConfirm = true
