[Automation (Local Only)]

## When enabled, materials from the equipped backpack are considered when crafting or building. [Not Synced with Server]
# Setting type: Boolean
Enable Craft From Backpack = true

## When enabled and player inventory is full, newly crafted items will be placed into the equipped backpack if space is available. [Not Synced with Server]
# Setting type: Boolean
Enable Craft Output To Backpack = true

## When enabled, picked up or looted items already present in the equipped backpack are automatically stored in the backpack. [Not Synced with Server]
# Setting type: Boolean
Enable Auto Store to Backpack = true

## When enabled, if the player inventory is full, picked up or looted items will automatically overflow into the equipped backpack if space is available. [Not Synced with Server]
# Setting type: Boolean
Enable Inventory Overflow To Backpack = true

[Local Config]

## If enabled, displays the mod overview and links splash screen on game startup.
# Setting type: Boolean
# Default value: true
Show Splash on Startup = false

## If enabled, sends anonymous mod launch and heartbeat telemetry to help improve mod stability and track active versions.
# Setting type: Boolean
# Default value: false
Enable Anonymous Telemetry = false

## If enabled, sends anonymous mod crash and error logs to help identify and resolve bugs.
# Setting type: Boolean
# Default value: true
Send Error Reports = false

## Hotkey to open backpack. [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: I
Open Backpack = I

## Hotkey to quickly drop backpack while on the run. [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: Y
Quickdrop Backpack = Y

## If enabled, both backpack and inventory will open when Inventory is opened. [Not Synced with Server]
# Setting type: Boolean
# Default value: false
Open with Inventory = true

## If enabled, the backpack panel will automatically open alongside crafting stations (workbench, forge, cauldron, modded stations). [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Open with Crafting Station = true

## If enabled, backpack will only open while hovering over equipped backpack and pressing hotkey.  This option overrides Open with Inventory. [Not Synced with Server]
# Setting type: Boolean
# Default value: false
Open with Interactive Hover = false

## If enabled, allows toggling between an opened container (such as a chest) and your equipped backpack using tab buttons or the backpack hotkey. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Container Tabs = true

## The gamepad button or combo used to toggle container tabs when focused on the container. Defaults to JoyRTrigger + JoyRStick (RT + R3). Set to None to disable gamepad toggling. [Not Synced with Server]
# Setting type: String
# Default value: JoyRTrigger + JoyRStick
# Acceptable values: JoyRStick, JoyLStick, JoyTabLeft, JoyTabRight, JoyButtonY, JoyButtonX, JoyButtonA, JoyButtonB, JoyBack, JoyStart, JoyDPadUp, JoyDPadDown, JoyDPadLeft, JoyDPadRight, JoyLTrigger, JoyRTrigger, JoyLTrigger + JoyButtonY, JoyLTrigger + JoyTabLeft, JoyLTrigger + JoyTabRight, JoyLTrigger + JoyRStick, JoyLTrigger + JoyLStick, JoyRTrigger + JoyButtonY, JoyRTrigger + JoyRStick, JoyTabLeft + JoyTabRight, None
Container Tabs Gamepad Button = JoyRTrigger + JoyRStick

## If enabled, both backpack and inventory will close with Open Backpack keybind is pressed while Inventory is open. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Close Inventory = true

## You can use a hotkey to quickly drop your equipped backpack in order to run faster away from danger. [Not Synced with Server]
# Setting type: Boolean
# Default value: false
Outward Mode = true

## Toggle To use the Material Shader Replacer (Requires Game Restart) [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Replace Shader = true

[Log Output Configuration]

## Toggles Log Output
# Setting type: Boolean
# Default value: true
Logging Enabled = true

## Minimum Log Level to Output
# Setting type: LogLevels
# Default value: Warning
# Acceptable values: Debug, Info, Warning, Error, Fatal
Log Level = Warning

[Wisplight Client Settings]

## Hotkey to turn Wisplight on and off [Not Synced with Server]
